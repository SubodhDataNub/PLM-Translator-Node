    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Apply the saved theme before first paint (the toggle lives in static/js/site.js) -->
    <script>
        (function () {
            let choice = 'system';
            try { choice = localStorage.getItem('dn-theme') || 'system'; } catch (e) { /* storage blocked */ }
            const root = document.documentElement;
            if (choice === 'light' || choice === 'dark') root.dataset.theme = choice;
            const dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            root.dataset.bsTheme = dark ? 'dark' : 'light';
        })();
    </script>

    <!-- Fonts: Fraunces (headings), IBM Plex Sans (UI), IBM Plex Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
