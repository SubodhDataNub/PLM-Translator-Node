<!DOCTYPE html>
<html lang="en">
<head>
{% include "partials/head.html" %}
    <title>Error {{ error_code }} - DN Translator</title>
</head>
<body>
{% include "partials/header.html" %}

    <main id="main" class="page">
        <section class="error-card" aria-labelledby="errorTitle">
            <span class="error-code mono">{{ error_code }}</span>
            <h1 id="errorTitle">{{ error_message }}</h1>
            <p class="lede">The page you asked for isn't here. Head back and start a new translation.</p>
            <a class="btn btn-primary btn-pill" href="{{ url_for('main.index') }}">
                <i class="fas fa-language me-2" aria-hidden="true"></i>Go to Single translation
            </a>
        </section>
    </main>

{% include "partials/footer.html" %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
