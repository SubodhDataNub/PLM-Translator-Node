_schema-version: 3.3.0
ID: plm-translator-cap
version: 1.0.0
description: "DN Translator - SAP CAP (Node.js) application for label translation using Google Cloud Translation API"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/copy-train-data.js
modules:
  - name: plm-translator-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: plm-translator-auth
      - name: plm-translator-db
      - name: plm-translator-destination
      - name: plm-translator-logs

  - name: plm-translator-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: plm-translator-db

  - name: plm-translator-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: dntranslations
          artifacts:
            - translations.zip
          target-path: app/
        - name: dnmasstranslation
          artifacts:
            - masstranslation.zip
          target-path: app/
        - name: dnactivity
          artifacts:
            - activity.zip
          target-path: app/
    requires:
      - name: plm-translator-auth
      - name: srv-api
      - name: plm-translator-html5-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: dntranslations
    type: html5
    path: app/translations
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: dnmasstranslation
    type: html5
    path: app/masstranslation
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: dnactivity
    type: html5
    path: app/activity
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: plm-translator-destinations
    type: com.sap.application.content
    requires:
      - name: plm-translator-auth
        parameters:
          service-key:
            name: plm-translator-auth-key
      - name: plm-translator-html5-host
        parameters:
          service-key:
            name: plm-translator-html5-host-key
      - name: srv-api
      - name: plm-translator-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: plm-translator-html5-repository
              ServiceInstanceName: plm-translator-html5-host
              ServiceKeyName: plm-translator-html5-host-key
              sap.cloud.service: plmtranslatorcap.service
            - Name: plm-translator-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: plm-translator-auth
              ServiceKeyName: plm-translator-auth-key
              sap.cloud.service: plmtranslatorcap.service

resources:
  - name: plm-translator-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: plm-translator-db
    type: org.cloudfoundry.existing-service
  - name: plm-translator-logs
    type: org.cloudfoundry.existing-service
  - name: plm-translator-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
  - name: plm-translator-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
