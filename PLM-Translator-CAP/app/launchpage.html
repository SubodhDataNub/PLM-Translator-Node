<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLM Translator</title>
    <script>
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            applications: {
                "TestResult-manage": {
                    title: "Translations",
                    description: "Translate and review label texts",
                    additionalInformation: "SAPUI5.Component=dn.translations",
                    applicationType: "URL",
                    url: "./translations/webapp"
                },
                "MassTranslation-manage": {
                    title: "Mass Translation",
                    description: "Translate an Excel file",
                    additionalInformation: "SAPUI5.Component=dn.masstranslation",
                    applicationType: "URL",
                    url: "./masstranslation/webapp"
                },
                "UserActivity-manage": {
                    title: "User Activity",
                    description: "Administrators only",
                    additionalInformation: "SAPUI5.Component=dn.activity",
                    applicationType: "URL",
                    url: "./activity/webapp"
                }
            }
        };
    </script>
    <script src="https://ui5.sap.com/1.148.13/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.148.13/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="allow"></script>
    <script>
        sap.ui.require(["sap/ui/core/Core"], async (Core) => {
            await Core.ready();
            sap.ushell.Container.createRenderer(undefined, true).then((renderer) => renderer.placeAt("content"));
        });
    </script>
</head>

<body class="sapUiBody" id="content"></body>

</html>
